apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ndia5-cluster-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    repoURL: https://github.com/acaryatanaya/Ndia5-DR-Setup.git
    targetRevision: main
    path: platform/kubernetes/cluster-secrets
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
