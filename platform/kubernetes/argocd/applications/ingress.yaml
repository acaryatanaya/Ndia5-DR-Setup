apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ndia5-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: default

  source:
    repoURL: https://github.com/acaryatanaya/Ndia5-DR-Setup.git
    targetRevision: main
    path: platform/kubernetes/ingress
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true