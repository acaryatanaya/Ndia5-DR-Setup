apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: argocd-image-updater-git-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-cluster-secret-store
    kind: ClusterSecretStore

  target:
    name: argocd-image-updater-git-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque

  data:
    - secretKey: username
      remoteRef:
        key: ndia5/dr/argocd-image-updater-git-creds
        property: username

    - secretKey: password
      remoteRef:
        key: ndia5/dr/argocd-image-updater-git-creds
        property: password
