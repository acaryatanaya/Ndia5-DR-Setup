apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ndia5-ingress
  namespace: ndia5
  annotations:
    alb.ingress.kubernetes.io/group.name: ndia5-dr-public
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-2:074235798563:certificate/fc620953-dffd-4ddb-b2dd-8974a01483de
    alb.ingress.kubernetes.io/ssl-redirect: '443'

spec:
  ingressClassName: alb
  
  rules:
    - host: dr-portal.ndia5.com  #dr-frontend
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ndia5-frontend
                port:
                  number: 3000