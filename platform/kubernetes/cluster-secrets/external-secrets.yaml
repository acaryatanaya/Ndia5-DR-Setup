# Backend
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: es-backend-dr
  namespace: ndia5
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-cluster-secret-store
    kind: ClusterSecretStore

  target:
    name: backend-secret-dr
    creationPolicy: Owner
    deletionPolicy: Retain

  dataFrom:
    - extract:
        key: ndia5/dr/backend

